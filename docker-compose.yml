# Optional: local PostgreSQL for development.   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sushi
      POSTGRES_PASSWORD: sushi
      POSTGRES_DB: sushi_photography
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
